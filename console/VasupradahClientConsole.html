/* The compiled Tailwind build ships no md: grid/col-span utilities, so multi-column forms and
   card rows silently collapsed to one column. Supply exactly the ones the app uses. */
@media (min-width: 768px) {
  .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .md\:grid-cols-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .md\:col-span-1 { grid-column: span 1 / span 1; }
  .md\:col-span-2 { grid-column: span 2 / span 2; }
  .md\:col-span-3 { grid-column: span 3 / span 3; }
  .md\:col-span-4 { grid-column: span 4 / span 4; }
  .md\:col-span-6 { grid-column: span 6 / span 6; }
  .md\:text-right { text-align: right; }
}

<script>
window.addEventListener("error", function (ev) {
  var r = document.getElementById("root");
  if (r && !r.getAttribute("data-err")) {
    r.setAttribute("data-err", "1");
    r.innerHTML = '<pre style="padding:16px;color:#b91c1c;font:13px/1.5 monospace;white-space:pre-wrap">Error: ' +
      (ev.message || "") + (ev.filename ? ("\n" + ev.filename + ":" + ev.lineno) : "") + '</pre>';
  }
});
</script>
